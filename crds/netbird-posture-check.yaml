apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netbirdposturechecks.netbird.io
spec:
  group: netbird.io
  scope: Namespaced
  names:
    kind: NetBirdPostureCheck
    listKind: NetBirdPostureCheckList
    plural: netbirdposturechecks
    singular: netbirdposturecheck
    shortNames: [nbpc]
    categories: [netbird]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: NBID
          type: string
          jsonPath: .status.id
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [name, description]
              properties:
                name:
                  type: string
                  minLength: 1
                description:
                  type: string
                checks:
                  type: object
                  properties:
                    nbVersionCheck:
                      type: object
                      properties:
                        minVersion: { type: string }
                    osVersionCheck:
                      type: object
                      properties:
                        android:
                          type: object
                          properties: { minVersion: { type: string } }
                        darwin:
                          type: object
                          properties: { minVersion: { type: string } }
                        ios:
                          type: object
                          properties: { minVersion: { type: string } }
                        linux:
                          type: object
                          properties: { minKernelVersion: { type: string } }
                        windows:
                          type: object
                          properties: { minKernelVersion: { type: string } }
                    geoLocationCheck:
                      type: object
                      required: [action, locations]
                      properties:
                        action:
                          type: string
                          enum: [allow, deny]
                        locations:
                          type: array
                          items:
                            type: object
                            required: [countryCode]
                            properties:
                              countryCode: { type: string }
                              cityName: { type: string }
                    peerNetworkRangeCheck:
                      type: object
                      required: [action, ranges]
                      properties:
                        action:
                          type: string
                          enum: [allow, deny]
                        ranges:
                          type: array
                          items: { type: string }
                    processCheck:
                      type: object
                      properties:
                        processes:
                          type: array
                          items:
                            type: object
                            properties:
                              linuxPath: { type: string }
                              macPath: { type: string }
                              windowsPath: { type: string }
            status:
              type: object
              properties:
                id: { type: string }
                synced: { type: boolean }
                observedGeneration: { type: integer }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
