apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netbirdpeers.netbird.io
spec:
  group: netbird.io
  scope: Namespaced
  names:
    kind: NetBirdPeer
    listKind: NetBirdPeerList
    plural: netbirdpeers
    singular: netbirdpeer
    shortNames: [nbp]
    categories: [netbird]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: NBID
          type: string
          jsonPath: .status.id
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [peerRef]
              description: |
                Manages settings of an already-registered peer. NetBird peers
                self-register via setup keys; this CRD only updates their
                settings and cannot create one. Deleting the CR unregisters
                the referenced peer from NetBird.
              properties:
                peerRef:
                  type: string
                  minLength: 1
                  description: Peer's name (hostname) — resolved to ID.
                sshEnabled:
                  type: boolean
                loginExpirationEnabled:
                  type: boolean
                inactivityExpirationEnabled:
                  type: boolean
                approvalRequired:
                  type: boolean
            status:
              type: object
              properties:
                id: { type: string }
                synced: { type: boolean }
                observedGeneration: { type: integer }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
