apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netbirddnsrecords.netbird.io
spec:
  group: netbird.io
  scope: Namespaced
  names:
    kind: NetBirdDNSRecord
    listKind: NetBirdDNSRecordList
    plural: netbirddnsrecords
    singular: netbirddnsrecord
    shortNames: [nbdr]
    categories: [netbird]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: NBID
          type: string
          jsonPath: .status.id
        - name: Zone
          type: string
          jsonPath: .spec.zoneRef
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [zoneRef, name, type, content, ttl]
              description: |
                A DNS record (A/AAAA/CNAME) inside a NetBirdDNSZone. Matched by
                (zone, name, type) for idempotent recovery.
              properties:
                zoneRef:
                  type: string
                  minLength: 1
                  description: Name of the parent NetBirdDNSZone; resolved to ID.
                name:
                  type: string
                  minLength: 1
                type:
                  type: string
                  enum: [A, AAAA, CNAME]
                content:
                  type: string
                  minLength: 1
                  maxLength: 255
                ttl:
                  type: integer
                  minimum: 0
            status:
              type: object
              properties:
                id: { type: string }
                zoneId: { type: string }
                synced: { type: boolean }
                observedGeneration: { type: integer }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
