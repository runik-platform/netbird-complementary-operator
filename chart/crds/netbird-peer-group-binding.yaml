apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netbirdpeergroupbindings.netbird.io
spec:
  group: netbird.io
  scope: Namespaced
  names:
    kind: NetBirdPeerGroupBinding
    listKind: NetBirdPeerGroupBindingList
    plural: netbirdpeergroupbindings
    singular: netbirdpeergroupbinding
    shortNames: [nbpgb]
    categories: [netbird]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Peer
          type: string
          jsonPath: .spec.peerRef
        - name: Group
          type: string
          jsonPath: .spec.groupRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [peerRef, groupRef]
              properties:
                peerRef:
                  type: string
                  minLength: 1
                  description: Exact name of an already-enrolled peer.
                groupRef:
                  type: string
                  minLength: 1
                  description: Exact existing NetBird group name.
            status:
              type: object
              properties:
                peerId: { type: string }
                groupId: { type: string }
                managed: { type: boolean }
                synced: { type: boolean }
                observedGeneration: { type: integer }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
