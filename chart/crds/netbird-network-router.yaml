apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netbirdnetworkrouters.netbird.io
spec:
  group: netbird.io
  scope: Namespaced
  names:
    kind: NetBirdNetworkRouter
    listKind: NetBirdNetworkRouterList
    plural: netbirdnetworkrouters
    singular: netbirdnetworkrouter
    shortNames: [nbnrt]
    categories: [netbird]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: NBID
          type: string
          jsonPath: .status.id
        - name: Network
          type: string
          jsonPath: .spec.networkRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [networkRef]
              x-kubernetes-validations:
                - rule: "!(has(self.peerRef) && size(self.peerRef) > 0 && has(self.peerGroupRefs) && size(self.peerGroupRefs) > 0)"
                  message: "peerRef and peerGroupRefs are mutually exclusive"
                - rule: "(has(self.peerRef) && size(self.peerRef) > 0) || (has(self.peerGroupRefs) && size(self.peerGroupRefs) > 0)"
                  message: "either peerRef or peerGroupRefs must be set"
              properties:
                networkRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1 }
                peerRef:
                  type: string
                  minLength: 1
                  description: Exact name of an already-registered peer.
                peerGroupRefs:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                enabled:
                  type: boolean
                  default: true
                masquerade:
                  type: boolean
                  default: true
                metric:
                  type: integer
                  minimum: 1
                  maximum: 9999
                  default: 9999
            status:
              type: object
              properties:
                id: { type: string }
                networkId: { type: string }
                synced: { type: boolean }
                observedGeneration: { type: integer }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
