apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: netbirdnetworkresources.netbird.io
spec:
  group: netbird.io
  scope: Namespaced
  names:
    kind: NetBirdNetworkResource
    listKind: NetBirdNetworkResourceList
    plural: netbirdnetworkresources
    singular: netbirdnetworkresource
    shortNames: [nbnres]
    categories: [netbird]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: NBID
          type: string
          jsonPath: .status.id
        - name: Network
          type: string
          jsonPath: .spec.networkRef.name
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [networkRef, name, address]
              properties:
                networkRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                description:
                  type: string
                  default: ""
                address:
                  type: string
                  minLength: 1
                  description: IP, host prefix, CIDR, domain or wildcard domain.
                enabled:
                  type: boolean
                  default: true
                groupRefs:
                  type: array
                  items: { type: string, minLength: 1 }
                  description: Exact group names, resolved to IDs.
            status:
              type: object
              properties:
                id: { type: string }
                networkId: { type: string }
                synced: { type: boolean }
                observedGeneration: { type: integer }
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
