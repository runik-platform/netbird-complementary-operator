# Default values for netbird-complementary-operator.
# Override with `-f my-values.yaml` or `--set key=value`.

replicaCount: 1

image:
  repository: ghcr.io/runik-platform/netbird-complementary-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # Leave empty to auto-derive from chart name.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# --- NetBird-specific configuration ---

netbird:
  # NetBird management URL (https://HOST). Mounted via ConfigMap as NB_MGMT_URL.
  managementUrl: "https://netbird.example.com"
  # Informational: range of NetBird versions this operator has been validated with.
  compatRange: ">=0.68.0,<0.69.0"
  # Secret containing the Personal Access Token. Defaults match the
  # official NetBird K8s operator convention.
  apiKeySecret:
    name: netbird-mgmt-api-key
    key: NB_API_KEY
    # Set to true to let the chart render the secret from a plaintext value
    # (NOT recommended — prefer leaving this false and creating the secret
    # out-of-band via kubectl, ExternalSecret, SealedSecret, etc.).
    create: false
    value: ""
    # Project the Secret as a file so kubelet updates are hot-reloaded by the
    # client. Set false only for legacy NB_API_KEY environment behavior.
    mountAsFile: true
    mountPath: /var/run/secrets/netbird-api-key

# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
logLevel: INFO

# Rate-limit / retry behavior for the NetBird API client.
rateLimit:
  maxRetries: 5
  baseDelay: "0.5"
  maxDelay: "30"

# Liveness/readiness probes.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    enabled: true
    initialDelaySeconds: 3
    periodSeconds: 10

# Metacontroller CompositeController hooks. Disable to manage them yourself.
compositeControllers:
  enabled: true
  resyncPeriodSeconds: 300
  timeout: 30s

roleBinding:
  # Membership changes happen outside Kubernetes; poll more frequently than
  # the general controller cadence. Individual CRs may request 15-3600s.
  resyncPeriodSeconds: 60

identitySync:
  # Fallback controller cadence. Each NetBirdIdentitySync may request its own
  # 15-3600 second poll interval and the webhook returns that value to Metacontroller.
  resyncPeriodSeconds: 60

# Extra environment variables (list of corev1.EnvVar).
extraEnv: []

# Extra volumes/volumeMounts (advanced).
extraVolumes: []
extraVolumeMounts: []
