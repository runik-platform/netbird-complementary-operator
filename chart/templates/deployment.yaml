apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netbird-complementary-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird-complementary-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "netbird-complementary-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "netbird-complementary-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "netbird-complementary-operator.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: webhook
          image: {{ include "netbird-complementary-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "netbird-complementary-operator.fullname" . }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NB_API_KEY_SECRET_NAME
              value: {{ .Values.netbird.apiKeySecret.name | quote }}
            - name: NB_API_KEY_SECRET_KEY
              value: {{ .Values.netbird.apiKeySecret.key | quote }}
            {{- if .Values.netbird.apiKeySecret.mountAsFile }}
            - name: NB_API_KEY_FILE
              value: {{ printf "%s/api-key" .Values.netbird.apiKeySecret.mountPath | quote }}
            {{- else }}
            - name: NB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.netbird.apiKeySecret.name }}
                  key: {{ .Values.netbird.apiKeySecret.key }}
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or .Values.netbird.apiKeySecret.mountAsFile .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.netbird.apiKeySecret.mountAsFile }}
            - name: netbird-api-key
              mountPath: {{ .Values.netbird.apiKeySecret.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.netbird.apiKeySecret.mountAsFile .Values.extraVolumes }}
      volumes:
        {{- if .Values.netbird.apiKeySecret.mountAsFile }}
        - name: netbird-api-key
          secret:
            secretName: {{ .Values.netbird.apiKeySecret.name }}
            optional: true
            items:
              - key: {{ .Values.netbird.apiKeySecret.key }}
                path: api-key
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
