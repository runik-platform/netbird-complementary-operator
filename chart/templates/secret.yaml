{{- if .Values.netbird.apiKeySecret.create -}}
{{- if not .Values.netbird.apiKeySecret.value -}}
{{- fail "netbird.apiKeySecret.create=true requires netbird.apiKeySecret.value to be set" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.netbird.apiKeySecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird-complementary-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.netbird.apiKeySecret.key }}: {{ .Values.netbird.apiKeySecret.value | quote }}
{{- end }}
