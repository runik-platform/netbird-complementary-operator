apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netbird-complementary-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird-complementary-operator.labels" . | nindent 4 }}
data:
  NB_MGMT_URL: {{ .Values.netbird.managementUrl | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  NB_RATE_LIMIT_MAX_RETRIES: {{ .Values.rateLimit.maxRetries | quote }}
  NB_RATE_LIMIT_BASE_DELAY: {{ .Values.rateLimit.baseDelay | quote }}
  NB_RATE_LIMIT_MAX_DELAY: {{ .Values.rateLimit.maxDelay | quote }}
  NB_COMPAT_RANGE: {{ .Values.netbird.compatRange | quote }}
