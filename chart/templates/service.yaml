apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird-complementary-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird-complementary-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "netbird-complementary-operator.selectorLabels" . | nindent 4 }}
