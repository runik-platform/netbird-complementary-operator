{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "netbird-complementary-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird-complementary-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "netbird-complementary-operator.fullname" . | quote }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "netbird-complementary-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird-complementary-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "netbird-complementary-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "netbird-complementary-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
