apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: netbird-peer
spec:
  generateSelector: true
  parentResource:
    apiVersion: netbird.io/v1alpha1
    resource: netbirdpeers
  resyncPeriodSeconds: 300
  hooks:
    sync:
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/sync/peer
        timeout: 30s
    finalize:
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/finalize/peer
        timeout: 30s
