apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: netbird-role-binding
spec:
  generateSelector: true
  parentResource:
    apiVersion: netbird.io/v1alpha1
    resource: netbirdrolebindings
  resyncPeriodSeconds: 60
  hooks:
    customize:
      version: v2
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/customize/role-binding
        timeout: 30s
    sync:
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/sync/role-binding
        timeout: 30s
    finalize:
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/finalize/role-binding
        timeout: 30s
