apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: netbird-policy
spec:
  generateSelector: true
  parentResource:
    apiVersion: netbird.io/v1alpha1
    resource: netbirdpolicies
  resyncPeriodSeconds: 300
  hooks:
    sync:
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/sync/policy
        timeout: 30s
    finalize:
      webhook:
        url: http://netbird-complementary-operator.netbird.svc.cluster.local/finalize/policy
        timeout: 30s
