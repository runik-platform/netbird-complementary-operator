apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-complementary-operator
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird-complementary-operator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-complementary-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-complementary-operator
    spec:
      serviceAccountName: netbird-complementary-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/runik-platform/netbird-complementary-operator:1.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: netbird-complementary-operator
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NB_API_KEY_SECRET_NAME
              value: netbird-mgmt-api-key
            - name: NB_API_KEY_SECRET_KEY
              value: NB_API_KEY
            - name: NB_API_KEY_FILE
              value: /var/run/secrets/netbird-api-key/api-key
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: netbird-api-key
              mountPath: /var/run/secrets/netbird-api-key
              readOnly: true
      volumes:
        - name: netbird-api-key
          secret:
            secretName: netbird-mgmt-api-key
            optional: true
            items:
              - key: NB_API_KEY
                path: api-key
