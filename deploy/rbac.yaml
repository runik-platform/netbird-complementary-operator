apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-complementary-operator
  namespace: netbird
---
# Metacontroller owns normal child reconciliation. The webhook writes the
# retained Owner Secret and removes child ownership during Retain finalization.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbird-complementary-operator
  namespace: netbird
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["netbird-complementary-operator"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbird-complementary-operator
  namespace: netbird
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netbird-complementary-operator
subjects:
  - kind: ServiceAccount
    name: netbird-complementary-operator
    namespace: netbird
