apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-complementary-operator
  namespace: netbird
data:
  NB_MGMT_URL: "https://netbird.example.com"
  LOG_LEVEL: "INFO"
  NB_RATE_LIMIT_MAX_RETRIES: "5"
  NB_RATE_LIMIT_BASE_DELAY: "0.5"
  NB_RATE_LIMIT_MAX_DELAY: "30"
  # Supported NetBird versions (informational, consumed by operators/humans):
  NB_COMPAT_RANGE: ">=0.68.0,<0.69.0"
